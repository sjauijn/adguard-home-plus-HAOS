---
configuration:
  log_level:
    name: Уровень логирования
    description: >-
      Управляет уровнем детализации логов приложения. Можно изменить,
      чтобы вывод был более или менее подробным — это может быть полезно
      при разборе неизвестной проблемы. Каждый уровень автоматически
      включает сообщения более серьёзного уровня.
  ssl:
    name: SSL
    description: >-
      Включает/выключает шифрование SSL (HTTPS) для прямого доступа к
      приложению. Эта настройка не влияет на службу Ingress.
  certfile:
    name: Файл сертификата
    description: >-
      Файл сертификата, используемый для SSL. Файл должен находиться в
      директории `/ssl/`.
  keyfile:
    name: Файл закрытого ключа
    description: >-
      Файл закрытого ключа, используемый для SSL. Файл должен находиться
      в директории `/ssl/`.
  leave_front_door_open:
    name: Оставить входную дверь открытой
    description: >-
      При включении отключает аутентификацию в AdGuard Home. Мы настоятельно
      не рекомендуем включать эту опцию, даже во внутренней сети.
      Используйте на свой страх и риск!
  safebrowsing_block_host:
    name: Хост блокировки безопасного просмотра
    description: >-
      Имя хоста, которым заменяется ответ на запросы, заблокированные
      безопасным просмотром. По умолчанию standard-block.dns.adguard.com,
      который указывает на внешнюю страницу блокировки AdGuard.
  parental_block_host:
    name: Хост блокировки родительского контроля
    description: >-
      Имя хоста, которым заменяется ответ на запросы, заблокированные
      родительским контролем. По умолчанию family-block.dns.adguard.com,
      который указывает на внешнюю страницу блокировки AdGuard.
network:
  53/udp: Порт DNS-сервера
  80/tcp: Веб-интерфейс (не требуется для Ingress)
